# ブラウザを使わないテスト(中継単体・拡張のスタブ)と構文チェック。ブラウザを使う E2E は手元で `pnpm test:e2e`
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: syntax
        run: for f in $(git ls-files '*.mjs' '*.js'); do node --check "$f" || exit 1; done
      - name: manifest
        run: node -e "const m=require('./extension/manifest.json'); for (const p of [...Object.values(m.icons), m.action.default_popup, m.options_page, m.background.service_worker]) require('fs').accessSync('extension/'+p)"
      - run: node test/e2e-relay.mjs
      - run: node test/e2e-hardening.mjs
